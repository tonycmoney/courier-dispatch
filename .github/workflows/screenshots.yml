name: Update screenshots

# Run manually after a deploy to refresh the README screenshots
# from the live site.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL of the running app
        required: true
        default: https://web-production-33a98.up.railway.app

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/screenshots.py "${{ inputs.url }}" docs/screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Update README screenshots from live site"
          git push
