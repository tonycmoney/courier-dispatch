name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite)
        run: pytest --cov=app --cov-report=term-missing
      - name: Smoke test against Postgres
        env:
          DATABASE_URL: postgresql://dispatch:dispatch@localhost:5432/dispatch
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              assert c.get("/api/summary").json()["stops_total"] == 18
              plan = c.post("/api/dispatch/optimize", json={"time_limit_s": 1}).json()
              assert plan["unassigned"] == [], plan
              print("Postgres OK:", plan["total_distance_km"], "km")
          EOF

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: |
          set +e
          docker build --progress=plain -t courier-dispatch . > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Surface the end of the log as an annotation so it is visible
            # without opening the raw logs.
            msg=$(tail -40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=docker build failed::$msg"
          fi
          exit $status
      - name: Container serves API and dashboard
        run: |
          docker run -d -p 8000:8000 --name app courier-dispatch
          ok=0
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && ok=1 && break; sleep 1; done
          docker logs app
          [ "$ok" = 1 ]
          curl -sf localhost:8000/ | grep -q "Courier Dispatch"
          curl -sf -X POST localhost:8000/api/dispatch/optimize \
            -H 'Content-Type: application/json' -d '{"time_limit_s":1}' | grep -q total_distance_km
